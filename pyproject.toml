[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sad-decoders"
version = "0.1.0"
description = "Sample-Aligned Decoders: drop-in decoders for latent generative models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "huggingface_hub>=0.23", "safetensors"]

[project.urls]
Homepage = "https://torpedo2003.github.io/SAD/"
Repository = "https://github.com/torpedo2003/SAD"

[tool.setuptools]
packages = ["sad"]
